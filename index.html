<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="pokemon.js" defer></script>
    <link rel="stylesheet" href="pokemon.css" />
  </head>
  <body>
    <main class="game">
      <header class="head">
        <h1>🎁 포켓몬 가챠</h1>
        <div class="chip">
          <b class="count"></b>
          <span>/ 151</span>
        </div>
      </header>
      <div class="stage">
        <div class="ball">
          <img src="pokeball.png" alt="" class="pokeball" />
        </div>
      </div>
      <div class="contents">
        <p class="name"></p>
        <p class="msg"></p>
      </div>
      <button class="btn">뽑기</button>
    </main>
  </body>
</html>
